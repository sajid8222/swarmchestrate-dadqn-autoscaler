apiVersion: v1
kind: ConfigMap
metadata:
  name: dadqn-config
  namespace: default
data:
  PROMETHEUS_URL: "http://prom-kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
  PROM_RATE_WINDOW: "1m"
  K8S_NAMESPACE: "default"
  SAMPLE_INTERVAL_SEC: "30"
  DECISION_INTERVAL_SEC: "15"
  SCALE_DOWN_COOLDOWN_SEC: "30"
  OBS_FALLBACK_FROM_CPU: "1"
  # Locust shim — translates Prometheus istio metrics to Locust /stats/requests JSON.
  # Deployed by 05-locust-shim.yaml; reachable in-cluster at this DNS name.
  # Agents read gateway-level RPS / p95 / users from this URL.
  LOCUST_URL: "http://locust-shim.default.svc.cluster.local:8089"
