apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dadqn-autoscaler
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dadqn-autoscaler
  namespace: default
subjects:
  - kind: ServiceAccount
    name: dadqn-autoscaler
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dadqn-autoscaler
