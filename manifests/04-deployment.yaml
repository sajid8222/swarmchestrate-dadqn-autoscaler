# Per-service DA-DQN — 10 separate Deployments, one per scalable microservice.
# Each pod loads ONLY its own service's model (via MY_SERVICE env + sed-patch on SCALABLE_SERVICES)
# and scales ONLY its own deployment. True decentralized topology: no single point of failure.
#
# CP is tainted NoSchedule → all 10 schedule across the 4 worker nodes.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dadqn-frontend
  namespace: default
  labels: {app: dadqn-autoscaler, svc: frontend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: dadqn-autoscaler, svc: frontend}
  template:
    metadata:
      labels: {app: dadqn-autoscaler, svc: frontend, istio.io/dataplane-mode: none}
    spec:
      serviceAccountName: dadqn-autoscaler
      containers:
        - name: agent
          image: proactivellmbasedproject/dadqn-autoscaler:v2
          imagePullPolicy: IfNotPresent
          command: ["sh","-c"]
          args:
            - >
              sed -i 's/^MAX_REPLICAS = 8/MAX_REPLICAS = 9/;
              s/^MAX_TOTAL_PODS = 35/MAX_TOTAL_PODS = 90/;
              s/"cpu_usage": 800.0/"cpu_usage": 3000.0/;
              s/"latency": 5000.0/"latency": 1500.0/' /app/dadqn_v3/config.py &&
              python -c "import os,re; svc=os.environ['MY_SERVICE']; p='/app/dadqn_v3/config.py'; s=open(p).read(); s=re.sub(r'^SCALABLE_SERVICES = \[[\s\S]*?\]', f'SCALABLE_SERVICES = [\"{svc}\"]', s, flags=re.M); full=['frontend','currencyservice','productcatalogservice','cartservice','adservice','checkoutservice','emailservice','paymentservice','shippingservice','recommendationservice','redis-cart']; s=re.sub(r'^ALL_SERVICES = .*', 'ALL_SERVICES = '+str(full), s, flags=re.M); open(p,'w').write(s); print('patched SCALABLE_SERVICES=',svc,'; ALL_SERVICES kept full')" &&
              find /app -name '*.pyc' -delete 2>/dev/null;
              exec python -m dadqn_v3.baselines.dadqn_serve
          env:
            - {name: MODEL_DIR, value: /mnt/sla_v1}
            - {name: MY_SERVICE, value: frontend}
          envFrom: [{configMapRef: {name: dadqn-config}}]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: sla-models, mountPath: /mnt/sla_v1, readOnly: true}
            - {name: mc-patch, mountPath: /app/dadqn_v3/environments/metrics_collector_v3.py, subPath: metrics_collector_v3.py, readOnly: true}
            - {name: sg-patch, mountPath: /app/dadqn_v3/service_graph.py, subPath: service_graph.py, readOnly: true}
            - {name: sae-patch, mountPath: /app/dadqn_v3/environments/service_agent_env.py, subPath: service_agent_env.py, readOnly: true}
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "1Gi"}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: sla-models, hostPath: {path: /tmp/sla_v1, type: Directory}}
        - {name: mc-patch, configMap: {name: mc-v3-patch}}
        - {name: sg-patch, configMap: {name: sg-v2-patch}}
        - {name: sae-patch, configMap: {name: sae-v4-patch}}
---
